# abs.tmux.conf — tuned tmux config for ABS-managed sessions (PLAN.md 4.2).
#
# This file is loaded ONLY on ABS's isolated tmux socket, i.e. every engine call
# runs `tmux -L abs -f <this file> ...`. It is never sourced into the user's own
# tmux server or their ~/.tmux.conf. Nothing here can affect a tmux the user
# started themselves — different socket, different server, different config.
#
# Goal: a clean, quiet, scroll-friendly host for a single full-window Claude Code
# TUI that the user starts from Telegram and later attaches to at the desk. No
# custom keybindings, no plugins, no prefix remap — attach behaviour stays the
# stock tmux the user already knows (PLAN.md manual test: detach with the normal
# tmux detach). Every setting below earns its place; comments say why.

# --- interaction -------------------------------------------------------------

# Mouse: wheel-scroll the scrollback, click-to-select, drag-select to copy. This
# is the "tuned-conf feel" the manual test checks — scrolling a long agent
# transcript with the trackpad instead of fighting copy-mode keys.
set -g mouse on

# Deep scrollback: agent sessions emit long transcripts; 50k lines keeps a full
# work session in reach when attaching after the fact. (Default is 2000.)
set -g history-limit 50000

# Copy a mouse/keyboard selection straight to the system clipboard via OSC 52,
# so text yanked while attached lands on the real clipboard over SSH too.
set -g set-clipboard on

# --- TUI responsiveness ------------------------------------------------------

# No lag after ESC. The default 500ms escape-time makes vim-style TUIs (and the
# Claude Code UI) feel sticky; 10ms is snappy without breaking real escape seqs.
set -sg escape-time 10

# Let the TUI know when the pane gains/loses focus (redraws, cursor handling).
set -g focus-events on

# Resize to the attached client, not the smallest ever-attached one — a session
# started headless (tiny default geometry) fills the terminal on first attach.
setw -g aggressive-resize on

# --- colour ------------------------------------------------------------------

# 256-colour + truecolor passthrough so the agent UI renders as intended. The
# override targets the outer TERM ABS runs under; harmless if unsupported.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# --- status bar (minimal, clean) --------------------------------------------

# One-line, low-noise status: session name on the left, clock on the right, no
# window-list clutter (ABS sessions are single-window). Muted colours so it
# doesn't fight the agent UI for attention.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour236,fg=colour245"
set -g status-left " abs:#S "
set -g status-left-length 40
set -g status-left-style "fg=colour252,bold"
set -g status-right " %H:%M "
set -g status-right-length 20
setw -g window-status-current-style "fg=colour252"
setw -g window-status-style "fg=colour244"

# Stable window numbering if a window is ever closed; base at 1 for readability.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# NOTE: remain-on-exit is deliberately left at its default (off). ABS's liveness
# contract is "session exists == launched command still running" (PLAN.md 4.2):
# when the command exits, tmux tears the pane and the (single-pane) session down,
# so is_alive() flips false. Turning remain-on-exit on would keep dead sessions
# around and break that contract.
